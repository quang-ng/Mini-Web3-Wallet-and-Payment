version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: wallet_db
    environment:
      POSTGRES_USER: ${DB_USER:-quang}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quang} -d wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallet_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet_backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      RPC_URL: ${RPC_URL}
      PRIVATE_KEY: ${PRIVATE_KEY}
      PAYMENT_VAULT_ADDRESS: ${PAYMENT_VAULT_ADDRESS}
      SIMPLE_TOKEN_ADDRESS: ${SIMPLE_TOKEN_ADDRESS}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_USER: ${DB_USER:-quang}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: wallet_db
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    networks:
      - wallet_network
    restart: unless-stopped

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wallet_frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3000/api}
    ports:
      - "80:80"
    networks:
      - wallet_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  wallet_network:
    driver: bridge
